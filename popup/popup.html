<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Enhancer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <label>
      Default speed
      <input id="defaultSpeed" type="number" min="0.5" max="3" step="0.05" />
    </label>
    <label>
      Step
      <input id="step" type="number" min="0.05" max="1" step="0.05" />
    </label>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
